{% extends "base.html" %}
{% block content %}
<div class="form-container">
    <h2>Login to {{ role | capitalize }} Portal</h2>
    <form method="POST">
        <div class="form-group">
            <label>Email Address or Registered Phone</label>
            <input type="text" name="identifier" class="form-control" required placeholder="Enter email or phone">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn btn-success w-100">Sign In</button>
    </form>
    <p class="mt-3 text-center">Don't have an account? <a href="{{ url_for('register', role=role) }}">Register here</a></p>
</div>
{% endblock %}
