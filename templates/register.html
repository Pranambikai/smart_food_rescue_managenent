{% extends "base.html" %}
{% block content %}
<div class="form-container">
    <h2>Create {{ role | capitalize }} Account</h2>
    <form method="POST">
        <div class="form-group">
            <label>Full Name / Organization Name</label>
            <input type="text" name="name" class="form-control" required placeholder="Enter name">
        </div>
        {% if role != 'volunteer' %}
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" class="form-control" required placeholder="Enter email">
        </div>
        {% endif %}
        <div class="form-group">
            <label>Mobile Number (Indian 10-digit starting with 6-9)</label>
            <input type="text" name="phone" pattern="[6-9][0-9]{9}" class="form-control" required placeholder="9842012345">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required placeholder="Create password">
        </div>
        {% if role != 'volunteer' %}
        <div class="form-group">
            <label>Location Address in Dindigul</label>
            <input type="text" name="address" class="form-control" required placeholder="Enter address">
        </div>
        {% endif %}
        <button type="submit" class="btn btn-success w-100">Create Account</button>
    </form>
    <p class="mt-3 text-center">Already have an account? <a href="{{ url_for('login', role=role) }}">Sign In</a></p>
</div>
{% endblock %}
